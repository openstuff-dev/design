name: Docs

# Publishes apps/docs to GitHub Pages (https://design.openstuff.dev) from main.
# Pages needs a public repository: until then the job is skipped. Turn Pages on once, under
# Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npx nx build docs --baseHref=/
      # Pages has no rewrites: its 404 page boots the app, which then shows the right route.
      - run: cp dist/apps/docs/browser/index.html dist/apps/docs/browser/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/apps/docs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
